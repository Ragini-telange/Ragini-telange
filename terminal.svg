<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t { font-family: 'Fira Code', 'Courier New', monospace; font-size: 20px; clip-path: inset(0 100% 0 0); animation-fill-mode: forwards; animation-name: type; animation-timing-function: steps(30, end); }
    .cmd { fill: #00e08a; }
    .out { fill: #e6edf3; }
    .dim { fill: #8b949e; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #00e08a; animation: blink 1s infinite; }
    .l1 { animation-delay: 0.5s;  animation-duration: 0.8s; }
    .l2 { animation-delay: 1.5s;  animation-duration: 1s; }
    .l3 { animation-delay: 3s;    animation-duration: 1s; }
    .l4 { animation-delay: 4.2s;  animation-duration: 1.8s; }
    .l5 { animation-delay: 6.5s;  animation-duration: 1s; }
    .l6 { animation-delay: 7.7s;  animation-duration: 1.6s; }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="780" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M10 22a12 12 0 0 1 12-12h756a12 12 0 0 1 12 12v26H10z" fill="#161b22"/>
  <circle cx="36" cy="30" r="7" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="7" fill="#ffbd2e"/>
  <circle cx="84" cy="30" r="7" fill="#27c93f"/>
  <text x="400" y="35" text-anchor="middle" class="dim">ragini@github: ~</text>

  <!-- lines -->
  <text x="40" y="95"  class="t cmd l1">$ whoami</text>
  <text x="40" y="128" class="t out l2">Ragini Telange</text>
  <text x="40" y="170" class="t cmd l3">$ cat role.txt</text>
  <text x="40" y="203" class="t out l4">Full-Stack | DSA | Problem Solver</text>
  <text x="40" y="245" class="t cmd l5">$ cat status.txt</text>
  <text x="40" y="278" class="t out l6">Open to software internships</text>
  <rect class="cursor" x="400" y="262" width="11" height="20" style="animation-delay:9.5s; opacity:0"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
